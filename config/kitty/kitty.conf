# CachyOS Kitty Terminal Configuration
# Configured with JetBrainsMono Nerd Font and Noctalia styling

# Font configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Ligatures (JetBrains Mono programming ligatures)
disable_ligatures cursor

# Window padding & appearance
window_padding_width 12
background_opacity   1.0
cursor_trail         0

# Colors
background #1a1b26
foreground #c0caf5

# Cursor & Bell
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no

# Scrollback & Mouse
scrollback_lines 10000
mouse_hide_wait  3.0
detect_urls      yes
url_style        curly

# Theme integration (Noctalia)
include themes/noctalia.conf
